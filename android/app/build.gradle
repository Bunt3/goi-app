import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The version comes from package.json, so the web build and the APK agree.
// versionCode must grow with every release: 1.2.3 -> 10203.
def pkgVersion = new JsonSlurper().parse(file('../../package.json')).version
def (vMajor, vMinor, vPatch) = pkgVersion.tokenize('.').collect { it.replaceAll(/[^0-9].*/, '') as int }
def pkgVersionCode = vMajor * 10000 + vMinor * 100 + vPatch

// Release signing, from the environment (CI secrets). Without them the
// release APK is built unsigned. The keystore must never be committed.
def keystorePath = System.getenv('GOI_KEYSTORE')
def keystorePassword = System.getenv('GOI_KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('GOI_KEY_ALIAS') ?: 'goi'

android {
    namespace = "io.github.bunt3.goi"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.bunt3.goi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pkgVersionCode
        versionName pkgVersion
        // ML Kit's text recognition ships native code per processor type;
        // these two cover Android phones (not emulators or Chromebooks on x86).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keystorePassword
            }
        }
    }
    buildTypes {
        release {
            if (keystorePath) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // On-device Japanese text recognition, model bundled in the APK. Its usage
    // reports are blocked by res/xml/network_security_config.xml.
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

